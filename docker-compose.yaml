services:
  database:
    image: postgres:18
    env_file: ".env"
    ports:
      - ${PGPORT}:${PGPORT}
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-U', 'postgres' ]
    volumes:
      - 'database-volume:/var/lib/postgresql/data'
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_PORT: ${PGPORT}


volumes:
  database-volume:
