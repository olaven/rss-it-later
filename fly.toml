# fly.toml app configuration file generated for rss-it-later on 2025-11-08T14:33:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rss-it-later'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 7070
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
